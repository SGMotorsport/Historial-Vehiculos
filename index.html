<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial del Vehículo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card-dark { background-color: #161b22; border: 1px solid #30363d; }
    .badge-vencido { background-color: #3c1618; color: #f85149; border: 1px solid #8b2829; }
    .badge-aldia { background-color: #13231b; color: #3fb950; border: 1px solid #234e35; }
  </style>
</head>
<body class="pb-28">

  <div id="app" class="max-w-md mx-auto min-h-screen">
    <div class="p-8 text-center text-gray-400">Cargando datos del vehículo...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const vehiculoId = urlParams.get('id') || 'gmq123';

    fetch('datos.json')
      .then(response => response.json())
      .then(data => {
        const taller = data.taller;
        const vehiculo = data.vehiculos[vehiculoId];
        const mantenimientos = data.mantenimientos[vehiculoId] || [];

        if (!vehiculo) {
          document.getElementById('app').innerHTML = `
            <div class="p-8 text-center text-red-400">
              <i class="fa-solid fa-triangle-exclamation text-4xl mb-2"></i>
              <p>Vehículo no encontrado (${vehiculoId})</p>
            </div>`;
          return;
        }

        let historialHtml = mantenimientos.map((m, index) => `
          <div class="card-dark rounded-2xl p-4 relative">
            <div class="absolute -left-[23px] top-4 w-3 h-3 ${index === 0 ? 'bg-red-500' : 'bg-gray-600'} rounded-full"></div>
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs font-bold ${index === 0 ? 'text-red-400 bg-red-500/10' : 'text-gray-400 bg-gray-800'} px-2 py-0.5 rounded">
                ${index === 0 ? 'Último Service' : 'Service Anterior'}
              </span>
              <span class="text-xs text-gray-400">${m.fecha}</span>
            </div>
            <p class="text-xs text-gray-300 mb-3">${m.detalle}</p>
            <div class="space-y-1 text-xs text-gray-300">
              <div><i class="fa-solid fa-oil-can text-amber-500 mr-2"></i>Aceite: ${m.aceite}</div>
              <div><i class="fa-solid fa-filter text-blue-400 mr-2"></i>Filtros: ${m.filtros}</div>
              <div><i class="fa-solid fa-gauge text-green-400 mr-2"></i>Km service: ${m.km.toLocaleString()} km</div>
            </div>
          </div>
        `).join('');

        document.getElementById('app').innerHTML = `
          <!-- Bar Superior del Taller -->
          <header class="bg-[#161b22] border-b border-gray-800 p-3 sticky top-0 z-50 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3">
              <img src="${taller.logo}" class="w-9 h-9 object-contain rounded-lg border border-gray-700">
              <div>
                <h2 class="text-sm font-bold text-white leading-tight">${taller.nombre}</h2>
                <p class="text-[10px] text-gray-400">Historial de Mantenimiento</p>
              </div>
            </div>
            <span class="text-emerald-400 text-xs flex items-center gap-1 font-semibold">
              <i class="fa-solid fa-shield-halved"></i> Oficial
            </span>
          </header>

          <!-- Imagen del Vehículo -->
          <div class="relative w-full h-60 overflow-hidden">
            <img src="${vehiculo.foto}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0d1117] via-transparent to-black/60"></div>
            <div class="absolute bottom-3 left-4 right-4">
              <h1 class="text-3xl font-extrabold tracking-wider text-white">${vehiculo.matricula}</h1>
              <p class="text-xs uppercase tracking-widest text-gray-300">${vehiculo.modelo}</p>
            </div>
          </div>

          <!-- Información Principal -->
          <div class="p-4 space-y-4">
            <div class="card-dark rounded-2xl p-4 space-y-3">
              <p class="text-xs text-gray-400">Propietario/a: <span class="text-white font-medium">${vehiculo.propietario}</span></p>
              <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                <span class="text-sm text-gray-400">Km actual</span>
                <span class="text-xl font-bold">${vehiculo.kmActual.toLocaleString()}</span>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-gray-800">
                <span class="text-sm text-gray-400">Estado</span>
                <span class="${vehiculo.estado === 'Vencido' ? 'badge-vencido' : 'badge-aldia'} px-3 py-1 rounded-full text-xs font-bold">
                  ${vehiculo.estado === 'Vencido' ? '✕ Vencido' : '✓ Al día'}
                </span>
              </div>
            </div>

            <!-- Historial -->
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-400 pt-2">Historial de Services</h3>
            <div class="space-y-4 border-l-2 border-red-500/50 pl-4 ml-2">
              ${historialHtml || '<p class="text-xs text-gray-500">Sin registros de service aún.</p>'}
            </div>

            <!-- Datos de Contacto del Taller (Footer) -->
            <div class="card-dark rounded-2xl p-4 mt-8 space-y-3 border-t-2 border-t-red-500">
              <div class="flex items-center space-x-3">
                <img src="${taller.logo}" class="w-10 h-10 object-contain rounded-lg">
                <div>
                  <h4 class="text-sm font-bold text-white">${taller.nombre}</h4>
                  <p class="text-xs text-gray-400">${taller.slogan}</p>
                </div>
              </div>
              <div class="space-y-1.5 text-xs text-gray-300 pt-2 border-t border-gray-800">
                <div class="flex items-center gap-2"><i class="fa-solid fa-location-dot text-red-500 w-4"></i> ${taller.direccion}</div>
                <div class="flex items-center gap-2"><i class="fa-solid fa-clock text-amber-500 w-4"></i> ${taller.horario}</div>
                <div class="flex items-center gap-2"><i class="fa-solid fa-envelope text-blue-400 w-4"></i> ${taller.email}</div>
              </div>
            </div>
          </div>

          <!-- Botones de Acción Flotantes -->
          <div class="fixed bottom-0 left-0 right-0 p-3 bg-[#0d1117]/90 backdrop-blur-md border-t border-gray-800 flex justify-center space-x-3 max-w-md mx-auto z-50">
            <a href="https://wa.me/${taller.whatsapp}?text=Hola,%20quisiera%20consultar%20por%20el%20vehículo%20${vehiculo.matricula}" class="flex-1 bg-emerald-500 text-black font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm">
              <i class="fa-brands fa-whatsapp text-lg"></i><span>Enviar mensaje</span>
            </a>
            <a href="tel:${taller.telefono}" class="flex-1 bg-red-600 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm">
              <i class="fa-solid fa-phone text-lg"></i><span>Llamar</span>
            </a>
          </div>
        `;
      });
  </script>
</body>
</html>
