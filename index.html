<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial del Vehículo - SG Motorsport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg border-b border-slate-800">
    <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img id="taller-logo" src="" alt="Logo Taller" class="h-12 w-12 object-cover rounded-xl border border-slate-700 shadow-sm hidden">
        <div>
          <h1 id="taller-nombre" class="text-lg font-black tracking-wider text-white">SG Motorsport</h1>
          <p id="taller-slogan" class="text-xs text-slate-400 font-medium">Reprogramación y Técnica</p>
        </div>
      </div>
      <span id="vehiculo-estado" class="px-3 py-1 rounded-full text-xs font-bold tracking-wide shadow-sm"></span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto w-full p-4 space-y-5 flex-grow">

    <!-- Loading State -->
    <div id="cargando" class="text-center py-16 space-y-3">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-300 border-t-slate-900"></div>
      <p class="text-sm font-semibold text-slate-500">Cargando expediente del vehículo...</p>
    </div>

    <!-- Error State -->
    <div id="error" class="hidden bg-red-50 border-2 border-red-200 text-red-700 p-5 rounded-2xl text-center space-y-2">
      <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500"></i>
      <h3 class="font-bold text-base">Vehículo no encontrado</h3>
      <p class="text-xs text-red-600">No se ha podido localizar la ficha técnica. Verifica el código QR o contacta con el taller.</p>
    </div>

    <!-- Vehicle Content -->
    <div id="contenido-vehiculo" class="hidden space-y-5">

      <!-- Vehicle Card -->
      <div class="bg-white rounded-2xl shadow-md border border-slate-200/80 overflow-hidden">
        <div class="relative h-56 bg-slate-800">
          <img id="vehiculo-foto" src="" alt="Foto del vehículo" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
          <div class="absolute bottom-3 left-4 right-4">
            <span id="vehiculo-matricula" class="inline-block bg-yellow-400 text-slate-950 px-2.5 py-0.5 rounded font-black text-xs tracking-wider shadow-sm mb-1 border border-yellow-500"></span>
            <h2 id="vehiculo-modelo" class="text-xl font-black text-white leading-tight"></h2>
          </div>
        </div>

        <div class="p-4 grid grid-cols-2 gap-3 bg-slate-50 border-t border-slate-100 text-xs">
          <div class="bg-white p-3 rounded-xl border border-slate-200/60 shadow-sm">
            <span class="text-slate-400 font-semibold block uppercase tracking-wider text-[10px]">Propietario</span>
            <span id="vehiculo-propietario" class="font-bold text-slate-700 text-sm mt-0.5 block truncate"></span>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200/60 shadow-sm">
            <span class="text-slate-400 font-semibold block uppercase tracking-wider text-[10px]">Kilometraje</span>
            <span id="vehiculo-km" class="font-bold text-slate-700 text-sm mt-0.5 block"></span>
          </div>
        </div>
      </div>

      <!-- Maintenance History -->
      <div class="space-y-3">
        <div class="flex justify-between items-center px-1">
          <h3 class="font-black text-slate-800 text-sm uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-wrench text-slate-500"></i> Historial Mantenimiento
          </h3>
          <span id="total-registros" class="text-xs font-bold text-slate-400 bg-slate-200 px-2 py-0.5 rounded-full"></span>
        </div>

        <div id="lista-mantenimientos" class="space-y-3">
          <!-- Dinámico -->
        </div>
      </div>

    </div>

  </main>

  <!-- Footer & Contact Action Buttons -->
  <footer class="bg-white border-t border-slate-200 shadow-lg mt-6">
    <div class="max-w-md mx-auto p-4 space-y-4">
      
      <!-- Prominent Call / WhatsApp Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <a id="btn-llamar" href="" class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-black text-white font-bold text-sm py-3 px-4 rounded-xl shadow-md transition-all active:scale-[0.98]">
          <i class="fa-solid fa-phone text-slate-300"></i> Llamar Taller
        </a>
        <a id="btn-whatsapp" href="" target="_blank" class="flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm py-3 px-4 rounded-xl shadow-md transition-all active:scale-[0.98]">
          <i class="fa-brands fa-whatsapp text-xl"></i> WhatsApp
        </a>
      </div>

      <!-- Workshop Contact Information -->
      <div class="text-center text-xs text-slate-500 space-y-1 pt-1 border-t border-slate-100">
        <p id="taller-direccion" class="font-semibold text-slate-700"></p>
        <p id="taller-horario" class="text-slate-400"></p>
      </div>

    </div>
  </footer>

  <!-- App Script Logic -->
  <script>
    async function cargarDatos() {
      const params = new URLSearchParams(window.location.search);
      const vehiculoId = params.get('id');

      if (!vehiculoId) {
        mostrarError();
        return;
      }

      try {
        const respuesta = await fetch('datos.json');
        if (!respuesta.ok) throw new Error('Error al cargar datos');

        const data = await respuesta.json();
        const taller = data.taller;
        const vehiculo = data.vehiculos[vehiculoId.toLowerCase()];
        const historial = data.mantenimientos[vehiculoId.toLowerCase()] || [];

        if (!vehiculo) {
          mostrarError();
          return;
        }

        // Taller Data
        document.getElementById('taller-nombre').textContent = taller.nombre;
        document.getElementById('taller-slogan').textContent = taller.slogan;
        document.getElementById('taller-direccion').textContent = taller.direccion;
        document.getElementById('taller-horario').textContent = taller.horario;
        document.getElementById('btn-llamar').href = `tel:${taller.telefono}`;
        document.getElementById('btn-whatsapp').href = `https://wa.me/${taller.whatsapp}`;

        if (taller.logo) {
          const logoImg = document.getElementById('taller-logo');
          logoImg.src = taller.logo;
          logoImg.classList.remove('hidden');
        }

        // Vehicle Data
        document.getElementById('vehiculo-modelo').textContent = vehiculo.modelo;
        document.getElementById('vehiculo-matricula').textContent = vehiculo.matricula;
        document.getElementById('vehiculo-propietario').textContent = vehiculo.propietario;
        document.getElementById('vehiculo-km').textContent = `${vehiculo.kmActual.toLocaleString()} km`;
        document.getElementById('vehiculo-foto').src = vehiculo.foto;

        // AUTOMATIC STATUS LOGIC (365 days interval)
        const estadoElem = document.getElementById('vehiculo-estado');
        if (historial.length > 0 && historial[0].fecha) {
          const fechaUltimo = new Date(historial[0].fecha);
          const fechaActual = new Date();
          const diasDiferencia = Math.floor((fechaActual - fechaUltimo) / (1000 * 60 * 60 * 24));

          if (diasDiferencia >= 365) {
            estadoElem.textContent = "Vencido";
            estadoElem.className = "px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700 border border-red-300 shadow-sm";
          } else {
            estadoElem.textContent = "Al día";
            estadoElem.className = "px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 border border-emerald-300 shadow-sm";
          }
        } else {
          estadoElem.textContent = "Sin datos";
          estadoElem.className = "px-3 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-700";
        }

        // History Render
        const listaHistorial = document.getElementById('lista-mantenimientos');
        document.getElementById('total-registros').textContent = `${historial.length}`;

        historial.forEach(item => {
          const card = document.createElement('div');
          card.className = "bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm space-y-2.5";
          card.innerHTML = `
            <div class="flex justify-between items-center text-xs pb-2 border-b border-slate-100">
              <span class="font-bold text-slate-800 flex items-center gap-1.5">
                <i class="fa-regular fa-calendar-check text-slate-400"></i> ${item.fecha}
              </span>
              <span class="bg-slate-100 px-2.5 py-0.5 rounded-full text-slate-600 font-extrabold text-[11px]">${item.km.toLocaleString()} km</span>
            </div>
            <div class="text-xs space-y-1.5 text-slate-600">
              <p class="flex justify-between"><span class="font-semibold text-slate-400">Aceite:</span> <span class="font-bold text-slate-800">${item.aceite}</span></p>
              <p class="flex justify-between"><span class="font-semibold text-slate-400">Filtros:</span> <span class="font-bold text-slate-800">${item.filtros}</span></p>
              ${item.detalle ? `<p class="text-slate-500 pt-2 border-t border-slate-100 mt-2 text-[11px] leading-relaxed">${item.detalle}</p>` : ''}
            </div>
          `;
          listaHistorial.appendChild(card);
        });

        // Display Content
        document.getElementById('cargando').classList.add('hidden');
        document.getElementById('contenido-vehiculo').classList.remove('hidden');

      } catch (e) {
        mostrarError();
      }
    }

    function mostrarError() {
      document.getElementById('cargando').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }

    cargarDatos();
  </script>
</body>
</html>
