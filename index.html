<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Motorsport - Historial del Vehículo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased">

  <!-- Header / Cabecera -->
  <header class="bg-black text-white shadow-md">
    <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img id="taller-logo" src="" alt="Logo Taller" class="h-12 w-12 object-contain rounded-full border border-gray-700 hidden">
        <div>
          <h1 id="taller-nombre" class="text-lg font-bold tracking-wide">SG Motorsport</h1>
          <p id="taller-slogan" class="text-xs text-gray-400">Reprogramación y Técnica</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Mensaje de Carga -->
    <div id="cargando" class="text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-black"></div>
      <p class="mt-2 text-sm text-gray-500">Cargando historial del vehículo...</p>
    </div>

    <!-- Mensaje de Error -->
    <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center">
      <p class="font-semibold">Vehículo no encontrado</p>
      <p class="text-xs mt-1">Verifica el código QR o ponte en contacto con el taller.</p>
    </div>

    <!-- Contenido del Vehículo -->
    <div id="contenido-vehiculo" class="hidden space-y-6">

      <!-- Ficha del Coche -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="relative h-48 bg-gray-200">
          <img id="vehiculo-foto" src="" alt="Foto del vehículo" class="w-full h-full object-cover">
          <span id="vehiculo-estado" class="absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-semibold shadow-sm"></span>
        </div>
        <div class="p-5">
          <div class="flex justify-between items-start">
            <div>
              <h2 id="vehiculo-modelo" class="text-xl font-bold text-gray-900"></h2>
              <p id="vehiculo-matricula" class="text-sm font-semibold text-gray-500 uppercase tracking-wider mt-0.5"></p>
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-gray-100 text-sm">
            <div>
              <span class="text-xs text-gray-400 block">Propietario</span>
              <span id="vehiculo-propietario" class="font-medium text-gray-700"></span>
            </div>
            <div>
              <span class="text-xs text-gray-400 block">Km Actuales</span>
              <span id="vehiculo-km" class="font-medium text-gray-700"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Historial de Mantenimientos -->
      <div>
        <h3 class="text-base font-bold text-gray-900 mb-3 flex items-center justify-between">
          <span>Historial de Mantenimiento</span>
          <span id="total-registros" class="text-xs font-normal text-gray-500"></span>
        </h3>
        
        <div id="lista-mantenimientos" class="space-y-3">
          <!-- Se completa dinámicamente -->
        </div>
      </div>

    </div>

  </main>

  <!-- Footer / Contacto -->
  <footer class="bg-white border-t border-gray-200 mt-10">
    <div class="max-w-xl mx-auto px-4 py-6 text-center text-xs text-gray-500 space-y-3">
      <p id="taller-direccion" class="font-medium text-gray-700"></p>
      <p id="taller-horario"></p>
      
      <div class="flex justify-center space-x-3 pt-2">
        <a id="btn-llamar" href="" class="px-4 py-2 bg-gray-900 text-white rounded-lg font-medium hover:bg-black transition-colors">Llamar al taller</a>
        <a id="btn-whatsapp" href="" target="_blank" class="px-4 py-2 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 transition-colors">WhatsApp</a>
      </div>
    </div>
  </footer>

  <!-- Script Lógica -->
  <script>
    async function cargarDatos() {
      const params = new URLSearchParams(window.location.search);
      const vehiculoId = params.get('id');

      if (!vehiculoId) {
        mostrarError();
        return;
      }

      try {
        const respuesta = await fetch('datos.json');
        if (!respuesta.ok) throw new Error('Error al cargar datos');
        
        const data = await respuesta.json();
        const taller = data.taller;
        const vehiculo = data.vehiculos[vehiculoId.toLowerCase()];
        const historial = data.mantenimientos[vehiculoId.toLowerCase()] || [];

        if (!vehiculo) {
          mostrarError();
          return;
        }

        // Renderizar Taller
        document.getElementById('taller-nombre').textContent = taller.nombre;
        document.getElementById('taller-slogan').textContent = taller.slogan;
        document.getElementById('taller-direccion').textContent = taller.direccion;
        document.getElementById('taller-horario').textContent = taller.horario;
        document.getElementById('btn-llamar').href = `tel:${taller.telefono}`;
        document.getElementById('btn-whatsapp').href = `https://wa.me/${taller.whatsapp}`;

        if (taller.logo) {
          const logoImg = document.getElementById('taller-logo');
          logoImg.src = taller.logo;
          logoImg.classList.remove('hidden');
        }

        // Renderizar Vehículo
        document.getElementById('vehiculo-modelo').textContent = vehiculo.modelo;
        document.getElementById('vehiculo-matricula').textContent = `Matrícula: ${vehiculo.matricula}`;
        document.getElementById('vehiculo-propietario').textContent = vehiculo.propietario;
        document.getElementById('vehiculo-km').textContent = `${vehiculo.kmActual.toLocaleString()} km`;
        document.getElementById('vehiculo-foto').src = vehiculo.foto;

        // CÁLCULO AUTOMÁTICO DE ESTADO (365 días)
        const estadoElem = document.getElementById('vehiculo-estado');
        if (historial.length > 0 && historial[0].fecha) {
          const fechaUltimo = new Date(historial[0].fecha);
          const fechaActual = new Date();
          const diasDiferencia = Math.floor((fechaActual - fechaUltimo) / (1000 * 60 * 60 * 24));

          if (diasDiferencia >= 365) {
            estadoElem.textContent = "Vencido";
            estadoElem.className = "absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-semibold bg-red-500 text-white shadow-sm";
          } else {
            estadoElem.textContent = "Al día";
            estadoElem.className = "absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-semibold bg-green-500 text-white shadow-sm";
          }
        } else {
          estadoElem.textContent = "Sin datos";
          estadoElem.className = "absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-semibold bg-gray-500 text-white shadow-sm";
        }

        // Renderizar Historial
        const listaHistorial = document.getElementById('lista-mantenimientos');
        document.getElementById('total-registros').textContent = `${historial.length} intervenciones`;

        historial.forEach(item => {
          const card = document.createElement('div');
          card.className = "bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-2";
          card.innerHTML = `
            <div class="flex justify-between items-center text-xs text-gray-500 pb-2 border-b border-gray-50">
              <span class="font-semibold text-gray-700">${item.fecha}</span>
              <span class="bg-gray-100 px-2 py-0.5 rounded text-gray-600 font-medium">${item.km.toLocaleString()} km</span>
            </div>
            <div class="text-sm space-y-1">
              <p><span class="font-semibold text-gray-600">Aceite:</span> ${item.aceite}</p>
              <p><span class="font-semibold text-gray-600">Filtros:</span> ${item.filtros}</p>
              ${item.detalle ? `<p class="text-xs text-gray-500 pt-1">${item.detalle}</p>` : ''}
            </div>
          `;
          listaHistorial.appendChild(card);
        });

        // Mostrar contenido
        document.getElementById('cargando').classList.add('hidden');
        document.getElementById('contenido-vehiculo').classList.remove('hidden');

      } catch (e) {
        mostrarError();
      }
    }

    function mostrarError() {
      document.getElementById('cargando').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }

    cargarDatos();
  </script>
</body>
</html>
