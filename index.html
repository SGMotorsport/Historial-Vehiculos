<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Motorsport - Historial del Vehículo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans pb-10">

  <!-- Header / Cabecera -->
  <header class="bg-black border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img id="taller-logo" src="" alt="Logo Taller" class="h-10 w-10 object-cover rounded-full border border-gray-700 hidden">
        <div>
          <h1 id="taller-nombre" class="text-base font-bold text-white tracking-wide">SG Motorsport</h1>
          <p id="taller-slogan" class="text-xs text-gray-400">Reprogramación y Técnica</p>
        </div>
      </div>
      <span id="vehiculo-estado" class="px-3 py-1 rounded-full text-xs font-semibold shadow-sm"></span>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Mensaje de Carga -->
    <div id="cargando" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-red-600"></div>
      <p class="mt-3 text-sm text-gray-400">Cargando historial del vehículo...</p>
    </div>

    <!-- Mensaje de Error -->
    <div id="error" class="hidden bg-red-950/50 border border-red-800 text-red-200 p-4 rounded-xl text-center">
      <p class="font-semibold text-sm">Vehículo no encontrado</p>
      <p class="text-xs mt-1 text-red-400">Verifica el código QR o ponte en contacto con el taller.</p>
    </div>

    <!-- Contenido del Vehículo -->
    <div id="contenido-vehiculo" class="hidden space-y-6">

      <!-- Ficha del Coche -->
      <div class="bg-gray-800/80 backdrop-blur border border-gray-700/60 rounded-2xl overflow-hidden shadow-xl">
        <div class="relative h-52 bg-gray-900">
          <img id="vehiculo-foto" src="" alt="Foto del vehículo" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-transparent to-transparent"></div>
        </div>
        
        <div class="p-5 space-y-4">
          <div>
            <span id="vehiculo-matricula" class="inline-block px-2.5 py-1 bg-red-600/20 text-red-400 text-xs font-bold rounded-md border border-red-500/30 tracking-wider mb-1"></span>
            <h2 id="vehiculo-modelo" class="text-xl font-bold text-white"></h2>
          </div>

          <div class="grid grid-cols-2 gap-4 pt-3 border-t border-gray-700/50 text-xs">
            <div>
              <span class="text-gray-400 block">Propietario</span>
              <span id="vehiculo-propietario" class="font-semibold text-gray-200 mt-0.5 block"></span>
            </div>
            <div>
              <span class="text-gray-400 block">Kilometraje Actual</span>
              <span id="vehiculo-km" class="font-semibold text-gray-200 mt-0.5 block"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Historial de Mantenimientos -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wider">Historial de Mantenimientos</h3>
          <span id="total-registros" class="text-xs text-gray-500"></span>
        </div>

        <div id="lista-mantenimientos" class="space-y-3">
          <!-- Se completa dinámicamente -->
        </div>
      </div>

    </div>

  </main>

  <!-- Footer / Contacto -->
  <footer class="max-w-xl mx-auto px-4 mt-8">
    <div class="bg-gray-800/50 border border-gray-700/40 rounded-2xl p-5 text-center text-xs space-y-3">
      <p id="taller-direccion" class="text-gray-300 font-medium"></p>
      <p id="taller-horario" class="text-gray-400"></p>

      <div class="flex justify-center space-x-3 pt-2">
        <a id="btn-llamar" href="" class="flex-1 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded-xl font-medium transition-colors">Llamar</a>
        <a id="btn-whatsapp" href="" target="_blank" class="flex-1 py-2.5 bg-green-600 hover:bg-green-500 text-white rounded-xl font-medium transition-colors">WhatsApp</a>
      </div>
    </div>
  </footer>

  <!-- Script Lógica -->
  <script>
    async function cargarDatos() {
      const params = new URLSearchParams(window.location.search);
      const vehiculoId = params.get('id');

      if (!vehiculoId) {
        mostrarError();
        return;
      }

      try {
        const respuesta = await fetch('datos.json');
        if (!respuesta.ok) throw new Error('Error al cargar datos');

        const data = await respuesta.json();
        const taller = data.taller;
        const vehiculo = data.vehiculos[vehiculoId.toLowerCase()];
        const historial = data.mantenimientos[vehiculoId.toLowerCase()] || [];

        if (!vehiculo) {
          mostrarError();
          return;
        }

        // Taller
        document.getElementById('taller-nombre').textContent = taller.nombre;
        document.getElementById('taller-slogan').textContent = taller.slogan;
        document.getElementById('taller-direccion').textContent = taller.direccion;
        document.getElementById('taller-horario').textContent = taller.horario;
        document.getElementById('btn-llamar').href = `tel:${taller.telefono}`;
        document.getElementById('btn-whatsapp').href = `https://wa.me/${taller.whatsapp}`;

        if (taller.logo) {
          const logoImg = document.getElementById('taller-logo');
          logoImg.src = taller.logo;
          logoImg.classList.remove('hidden');
        }

        // Vehículo
        document.getElementById('vehiculo-modelo').textContent = vehiculo.modelo;
        document.getElementById('vehiculo-matricula').textContent = vehiculo.matricula;
        document.getElementById('vehiculo-propietario').textContent = vehiculo.propietario;
        document.getElementById('vehiculo-km').textContent = `${vehiculo.kmActual.toLocaleString()} km`;
        document.getElementById('vehiculo-foto').src = vehiculo.foto;

        // CÁLCULO AUTOMÁTICO DE ESTADO (365 días)
        const estadoElem = document.getElementById('vehiculo-estado');
        if (historial.length > 0 && historial[0].fecha) {
          const fechaUltimo = new Date(historial[0].fecha);
          const fechaActual = new Date();
          const diasDiferencia = Math.floor((fechaActual - fechaUltimo) / (1000 * 60 * 60 * 24));

          if (diasDiferencia >= 365) {
            estadoElem.textContent = "Vencido";
            estadoElem.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-600/30 text-red-400 border border-red-500/30";
          } else {
            estadoElem.textContent = "Al día";
            estadoElem.className = "px-3 py-1 rounded-full text-xs font-semibold bg-green-600/30 text-green-400 border border-green-500/30";
          }
        } else {
          estadoElem.textContent = "Sin datos";
          estadoElem.className = "px-3 py-1 rounded-full text-xs font-semibold bg-gray-700 text-gray-300";
        }

        // Historial
        const listaHistorial = document.getElementById('lista-mantenimientos');
        document.getElementById('total-registros').textContent = `${historial.length} intervenciones`;

        historial.forEach(item => {
          const card = document.createElement('div');
          card.className = "bg-gray-800/60 border border-gray-700/50 p-4 rounded-xl space-y-2";
          card.innerHTML = `
            <div class="flex justify-between items-center text-xs pb-2 border-b border-gray-700/40">
              <span class="font-bold text-red-400">${item.fecha}</span>
              <span class="bg-gray-700/60 px-2 py-0.5 rounded text-gray-300 font-medium">${item.km.toLocaleString()} km</span>
            </div>
            <div class="text-xs space-y-1 pt-1 text-gray-300">
              <p><span class="text-gray-400 font-semibold">Aceite:</span> ${item.aceite}</p>
              <p><span class="text-gray-400 font-semibold">Filtros:</span> ${item.filtros}</p>
              ${item.detalle ? `<p class="text-gray-400 pt-1 border-t border-gray-700/30 mt-2">${item.detalle}</p>` : ''}
            </div>
          `;
          listaHistorial.appendChild(card);
        });

        // Mostrar
        document.getElementById('cargando').classList.add('hidden');
        document.getElementById('contenido-vehiculo').classList.remove('hidden');

      } catch (e) {
        mostrarError();
      }
    }

    function mostrarError() {
      document.getElementById('cargando').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }

    cargarDatos();
  </script>
</body>
</html>
